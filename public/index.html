<!DOCTYPE html>
<html class="dark" lang="lo">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>MACRO_TERMINAL // Rolling Forecast Engine</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Lao:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "surface": "#0c1324",
                        "surface-low": "#151b2d",
                        "surface-container": "#191f31",
                        "surface-high": "#23293c",
                        "primary": "#8ed5ff",
                        "tertiary": "#ffc176",
                        "error": "#ffb4ab",
                        "outline-variant": "#3e484f",
                        "on-surface": "#dce1fb",
                        "on-surface-variant": "#bdc8d1"
                    },
                    fontFamily: {
                        sans: ['Noto Sans Lao', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace']
                    }
                }
            }
        }
    </script>
    <style>
        body, * { font-family: 'Noto Sans Lao', sans-serif; }
        .font-mono { font-family: 'JetBrains Mono', monospace !important; }
    </style>
</head>
<body class="bg-[#0c1324] text-[#dce1fb] min-h-screen flex flex-col font-sans selection:bg-primary selection:text-black">

    <header class="fixed top-0 left-0 w-full h-11 z-50 flex items-center justify-between px-3 bg-surface border-b border-outline-variant select-none">
        <div class="flex items-center gap-2">
            <span class="material-symbols-outlined text-primary text-[18px]">update</span>
            <h1 class="font-mono text-xs font-bold text-primary tracking-wider uppercase">ROLLING_FORECAST // ລະບົບຄາດການຂ່າວມື້ຕໍ່ໄປ</h1>
        </div>
        <button onclick="fetchRollingData()" class="flex items-center gap-1 px-3 py-1 bg-primary text-black font-mono text-[11px] font-bold hover:bg-white transition-colors">
            <span class="material-symbols-outlined text-[14px]">sync</span>
            <span>SYNC DATA</span>
        </button>
    </header>

    <main class="flex-1 p-3 max-w-[1600px] mx-auto w-full pt-14 pb-12 space-y-3">
        
        <!-- Live Cycle Header -->
        <div class="bg-surface-high border border-outline-variant p-3 flex justify-between items-center">
            <div class="flex items-center gap-2 font-mono text-xs">
                <span class="w-2 h-2 rounded-full bg-primary animate-ping"></span>
                <span id="cycle-title" class="text-white font-bold">ກຳລັງດຶງຂໍ້ມູນ Forex Factory...</span>
            </div>
            <span class="text-[11px] font-mono text-primary bg-surface border border-outline-variant px-2 py-0.5">
                TIMEZONE: GMT+7 (ໂມງລາວ)
            </span>
        </div>

        <!-- Dynamic Predictions for All Upcoming Days -->
        <div class="space-y-2">
            <div class="font-mono text-xs font-bold text-primary uppercase flex items-center gap-1.5">
                <span class="material-symbols-outlined text-base">psychology</span>
                <span>ລາຍການຂ່າວມື້ຕໍ່ໄປ &amp; ການຄາດການຄວາມໜ້າຈະເປັນ (UPCOMING PROBABILITY CARDS)</span>
            </div>

            <div id="predictions-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-3">
                <!-- Injected dynamically for each upcoming news item -->
            </div>
        </div>

    </main>

    <script>
        async function fetchRollingData() {
            try {
                const res = await fetch('/api/rolling-macro-feed');
                const json = await res.json();
                if (json.success && json.data) renderUI(json.data);
            } catch (err) {
                console.error(err);
            }
        }

        function renderUI(d) {
            document.getElementById('cycle-title').innerText = d.currentCycle;

            const grid = document.getElementById('predictions-grid');
            if (d.predictions.length === 0) {
                grid.innerHTML = `<div class="col-span-3 p-6 text-center bg-surface border border-outline-variant text-on-surface-variant">ບໍ່ມີຂ່າວແດງ-ສົ້ມ ທີ່ກຳລັງຈະອອກໃນຮອບອາທິດນີ້</div>`;
                return;
            }

            grid.innerHTML = d.predictions.map((p, idx) => `
                <div class="bg-surface p-3.5 border border-outline-variant space-y-2.5 flex flex-col justify-between">
                    <div>
                        <div class="flex justify-between items-start border-b border-outline-variant pb-2">
                            <div>
                                <span class="text-xs font-bold text-white block">${p.title}</span>
                                <span class="text-[10px] font-mono text-primary">${p.dateGMT7} • ${p.timeGMT7}</span>
                            </div>
                            <span class="text-[9px] font-mono font-bold px-1.5 py-0.5 ${p.impact === 'High' ? 'bg-red-500/20 text-red-400 border border-red-500/30' : 'bg-orange-500/20 text-orange-400 border border-orange-500/30'}">
                                ${p.impact === 'High' ? '🟥 ແດງ' : '🟧 ສົ້ມ'}
                            </span>
                        </div>

                        <div class="flex justify-between text-[11px] font-mono text-on-surface-variant my-2">
                            <span>ຄາດການ: <strong class="text-white">${p.forecast}</strong></span>
                            <span>ກ່ອນໜ້າ: <strong>${p.previous}</strong></span>
                        </div>

                        <!-- Probability Bars -->
                        <div class="space-y-1.5 font-mono text-[11px]">
                            <div>
                                <div class="flex justify-between text-[10px] mb-0.5">
                                    <span class="text-error font-bold">🔥 ໂອກາດສູງກວ່າຄາດ (Above):</span>
                                    <span class="font-bold text-error">${p.probAbove}%</span>
                                </div>
                                <div class="w-full bg-surface-low h-1.5 border border-outline-variant">
                                    <div class="bg-error h-full" style="width: ${p.probAbove}%;"></div>
                                </div>
                            </div>
                            <div>
                                <div class="flex justify-between text-[10px] mb-0.5">
                                    <span class="text-primary">↔️ ໂອກາດຕາມຄາດ (In-line):</span>
                                    <span class="font-bold text-primary">${p.probInline}%</span>
                                </div>
                                <div class="w-full bg-surface-low h-1.5 border border-outline-variant">
                                    <div class="bg-primary h-full" style="width: ${p.probInline}%;"></div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="p-2.5 bg-surface-low border border-outline-variant text-xs text-on-surface leading-relaxed mt-2">
                        <div class="text-[10px] font-bold text-primary mb-1">💡 ວິເຄາະຈາກຕົວເລກກ່ອນໜ້າ:</div>
                        <p class="text-[11px] text-on-surface-variant font-sans">${p.reasoning}</p>
                    </div>
                </div>
            `).join('');
        }

        window.addEventListener('DOMContentLoaded', fetchRollingData);
    </script>
</body>
</html>
