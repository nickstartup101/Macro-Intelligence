<!DOCTYPE html>
<html class="dark" lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Economic Intelligence Terminal</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@500;600;700&amp;family=Noto+Sans+Lao:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
    
    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "background": "#051424",
                        "surface": "#051424",
                        "surface-container-lowest": "#010f1f",
                        "surface-container-low": "#0d1c2d",
                        "surface-container": "#122131",
                        "surface-container-high": "#1c2b3c",
                        "surface-container-highest": "#273647",
                        "surface-variant": "#273647",
                        "primary": "#bec6e0",
                        "primary-container": "#0f172a",
                        "secondary": "#adc6ff",
                        "secondary-container": "#0566d9",
                        "on-secondary-container": "#e6ecff",
                        "tertiary": "#4edea3",
                        "tertiary-fixed-dim": "#4edea3",
                        "tertiary-container": "#001c10",
                        "on-tertiary-container": "#009365",
                        "error": "#ffb4ab",
                        "error-container": "#93000a",
                        "on-error-container": "#ffdad6",
                        "outline-variant": "#45464d",
                        "on-surface": "#d4e4fa",
                        "on-surface-variant": "#c6c6cd"
                    },
                    fontFamily: {
                        sans: ['Inter', 'Noto Sans Lao', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                        lao: ['Noto Sans Lao', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <style>
        body { background-color: #051424; color: #d4e4fa; }
        .glass-panel { background: rgba(30, 41, 59, 0.6); backdrop-filter: blur(12px); border: 1px solid rgba(71, 85, 105, 0.4); }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        .pulse-red { animation: pulse-red 2s infinite; }
        @keyframes pulse-red {
            0% { border-color: rgba(239, 68, 68, 0.2); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.4); }
            70% { border-color: rgba(239, 68, 68, 0.8); box-shadow: 0 0 0 4px rgba(239, 68, 68, 0); }
            100% { border-color: rgba(239, 68, 68, 0.2); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }

        .line-flow { stroke-dasharray: 5; animation: dash 20s linear infinite; }
        @keyframes dash { to { stroke-dashoffset: -100; } }

        .ticker-wrap { width: 100%; overflow: hidden; background-color: #010f1f; white-space: nowrap; }
        .ticker { display: inline-block; animation: ticker 28s linear infinite; }
        .ticker:hover { animation-play-state: paused; }
        @keyframes ticker { 0% { transform: translate3d(0, 0, 0); } 100% { transform: translate3d(-50%, 0, 0); } }
    </style>
</head>
<body class="antialiased min-h-screen pb-24 md:pb-8 selection:bg-secondary-container selection:text-on-secondary-container">

    <!-- 1. LIVE MARQUEE TICKER TAPE -->
    <div class="ticker-wrap h-8 border-b border-outline-variant/40 flex items-center sticky top-0 z-50">
        <div id="ticker-track" class="ticker flex gap-8 font-mono text-xs px-4 text-on-surface-variant">
            <!-- Dynamic quotes inserted via JS -->
        </div>
    </div>

    <!-- 2. TOP APP BAR WITH ROUTE & LANGUAGE SWITCHER -->
    <header class="bg-surface/90 backdrop-blur-md border-b border-outline-variant/40 flex items-center justify-between px-4 md:px-8 w-full h-16 sticky top-8 z-40">
        <div class="flex items-center gap-3">
            <button id="nav-back-btn" onclick="navigate('#/')" class="hidden p-2 rounded-full hover:bg-surface-variant/50 text-on-surface transition-colors">
                <span class="material-symbols-outlined">arrow_back</span>
            </button>
            <div class="flex items-center gap-2 cursor-pointer" onclick="navigate('#/')">
                <span class="material-symbols-outlined text-primary text-2xl">sensors</span>
                <h1 id="view-title" class="font-bold text-lg md:text-xl tracking-tight text-white">Macro Intelligence</h1>
            </div>
        </div>

        <div class="flex items-center gap-3">
            <!-- Language Switcher Pill -->
            <div class="bg-surface-container-highest p-0.5 rounded-lg flex border border-outline-variant/50 font-mono text-xs">
                <button id="lang-btn-en" onclick="setLanguage('EN')" class="px-2.5 py-1 rounded bg-secondary-container text-white font-bold transition-all">EN</button>
                <button id="lang-btn-lo" onclick="setLanguage('LO')" class="px-2.5 py-1 rounded text-on-surface-variant hover:text-white font-bold transition-all">🇱🇦 ລາວ</button>
            </div>
            
            <div class="hidden sm:flex items-center gap-1.5 px-2.5 py-1 rounded bg-error-container/20 border border-error/30 text-error text-[11px] font-mono">
                <span class="w-1.5 h-1.5 rounded-full bg-error animate-ping"></span>
                <span data-i18n="pollingBadge">HIGH SENSITIVITY</span>
            </div>
        </div>
    </header>

    <!-- 3. VIEW CONTAINER -->
    <main class="max-w-7xl mx-auto px-4 md:px-8 py-6">

        <!-- ============================================================== -->
        <!-- VIEW 1: MACRO INTELLIGENCE DASHBOARD (#/ or empty)             -->
        <!-- ============================================================== -->
        <div id="view-dashboard" class="space-y-5">
            <!-- Regime Banner -->
            <section class="bg-surface-container-high rounded-xl p-5 border border-outline-variant/30 relative overflow-hidden">
                <div class="absolute top-0 right-0 w-36 h-36 bg-blue-500/10 rounded-full blur-3xl -mr-10 -mt-10"></div>
                <div class="flex justify-between items-start mb-2 relative z-10">
                    <h2 class="text-xs font-bold text-on-surface-variant uppercase tracking-wider" data-i18n="regimeLabel">ECONOMIC REGIME</h2>
                    <div class="w-3 h-3 rounded-full bg-[#3B82F6] shadow-[0_0_10px_#3B82F6]"></div>
                </div>
                <div class="relative z-10">
                    <p id="regime-title" class="font-mono text-xl md:text-2xl text-primary font-bold tracking-tight">GROWTH STRONG / INFLATION STICKY</p>
                    <p class="text-sm text-on-surface-variant mt-1">
                        <span data-i18n="regimeConf">Regime stability confidence:</span> <span class="font-mono text-on-surface font-semibold" id="regime-conf-val">84%</span>
                    </p>
                </div>
            </section>

            <!-- State Scores Gauges -->

                <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
                    <!-- Labor -->
                    <div class="bg-surface-container-high rounded-lg p-3.5 border border-outline-variant/30">
                        <div class="flex justify-between items-center mb-2">
                            <span class="text-xs font-medium" data-i18n="labor">LABOR</span>
                            <span class="font-mono font-bold text-error">+20</span>
                        </div>
                        <div class="w-full h-1.5 bg-[#334155] rounded-full relative mb-1.5">
                            <div class="absolute left-1/2 w-0.5 h-3 bg-on-surface -top-0.5"></div>
                            <div class="h-full bg-error rounded-full" style="width: 20%; margin-left: 50%;"></div>
                        </div>
                        <div class="text-right text-[11px] font-bold text-error" data-i18n="cooling">COOLING</div>
                    </div>
                    <!-- Inflation -->
                    <div class="bg-surface-container-high rounded-lg p-3.5 border border-outline-variant/30">
                        <div class="flex justify-between items-center mb-2">
                            <span class="text-xs font-medium" data-i18n="inflation">INFLATION</span>
                            <span class="font-mono font-bold text-[#3B82F
